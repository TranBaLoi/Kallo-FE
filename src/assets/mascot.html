<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:transparent}body{display:grid;place-items:center}.mascot{width:100%;height:100%}
@keyframes floatBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulseGlow{0%,100%{transform:scale(.96);opacity:.7}50%{transform:scale(1.05);opacity:1}}
@keyframes shadowBreathe{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(.85);opacity:.45}}
@keyframes tailWag{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
@keyframes sproutSway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
@keyframes earTwitchLeft{0%,90%,100%{transform:rotate(0)}94%{transform:rotate(-4deg)}98%{transform:rotate(2deg)}}
@keyframes earTwitchRight{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(4deg)}96%{transform:rotate(-2deg)}}
@keyframes sparkleTwinkle{0%,100%{opacity:.3;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(45deg)}}
@keyframes sparkleTwinkleAlt{0%,100%{opacity:1;transform:scale(1.1) rotate(20deg)}50%{opacity:.2;transform:scale(.6) rotate(60deg)}}
@keyframes glassShine{0%,80%,100%{transform:translateX(0);opacity:.3}88%{transform:translateX(18px);opacity:.8}94%{transform:translateX(30px);opacity:.1}}
@keyframes medalGleam{0%,100%{transform:rotate(0) scale(1);filter:drop-shadow(0 0 2px rgba(234,179,8,.3))}50%{transform:rotate(3deg) scale(1.04);filter:drop-shadow(0 0 8px rgba(250,204,21,.8))}}
@keyframes laurelFloat{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.ambient-glow{transform-origin:300px 300px;animation:pulseGlow 4s ease-in-out infinite}.ground-shadow{transform-origin:300px 485px;animation:shadowBreathe 3s ease-in-out infinite}.mascot-floating-body{transform-origin:300px 400px;animation:floatBob 3s ease-in-out infinite}.tail-motion{transform-origin:360px 425px;animation:tailWag 2.5s ease-in-out infinite}.sprout-motion{transform-origin:300px 195px;animation:sproutSway 2.8s ease-in-out infinite}.left-ear{transform-origin:240px 220px;animation:earTwitchLeft 5s ease-in-out infinite}.right-ear{transform-origin:360px 220px;animation:earTwitchRight 4.5s ease-in-out infinite}.sparkle-1{transform-origin:445px 170px;animation:sparkleTwinkle 2.2s ease-in-out infinite}.sparkle-2{transform-origin:125px 230px;animation:sparkleTwinkleAlt 2.6s ease-in-out infinite}.sparkle-3{transform-origin:470px 378px;animation:sparkleTwinkle 3s ease-in-out infinite .5s}.glass-reflect{animation:glassShine 4s ease-in-out infinite}.medal-motion{transform-origin:300px 415px;animation:medalGleam 3s ease-in-out infinite}.laurel-wreath-anim{transform-origin:300px 300px;animation:laurelFloat 3.5s ease-in-out infinite}
</style>
</head>
