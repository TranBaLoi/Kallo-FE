<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" fill="none">
<defs>
<radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#4ade80" stop-opacity="0.35"/>
<stop offset="60%" stop-color="#22c55e" stop-opacity="0.12"/>
<stop offset="100%" stop-color="#15803d" stop-opacity="0"/>
</radialGradient>
<radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#052e16" stop-opacity="0.8"/>
<stop offset="70%" stop-color="#021f0e" stop-opacity="0.4"/>
<stop offset="100%" stop-color="#000" stop-opacity="0"/>
</radialGradient>
<linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#4ade80"/>
<stop offset="50%" stop-color="#22c55e"/>
<stop offset="100%" stop-color="#16a34a"/>
</linearGradient>
<linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#86efac"/>
<stop offset="35%" stop-color="#4ade80"/>
<stop offset="100%" stop-color="#22c55e"/>
</linearGradient>
<linearGradient id="earInner" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#bbf7d0"/>
<stop offset="100%" stop-color="#4ade80"/>
</linearGradient>
<linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#1e293b"/>
<stop offset="100%" stop-color="#0f172a"/>
</linearGradient>
<linearGradient id="laptopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#bbf7d0"/>
<stop offset="35%" stop-color="#86efac"/>
<stop offset="100%" stop-color="#4ade80"/>
</linearGradient>
<linearGradient id="medalRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#15803d"/>
<stop offset="100%" stop-color="#14532d"/>
</linearGradient>
<linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#fef9c3"/>
<stop offset="40%" stop-color="#facc15"/>
<stop offset="80%" stop-color="#eab308"/>
<stop offset="100%" stop-color="#a16207"/>
</linearGradient>
<filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
<feGaussianBlur result="blur" stdDeviation="4"/>
<feComposite in="SourceGraphic" in2="blur" operator="over"/>
</filter>
<style>
@keyframes floatBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes headBob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(3px) rotate(.6deg)}}
@keyframes typeLeft{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes typeRight{0%,100%{transform:translateY(-4px)}50%{transform:translateY(1px)}}
@keyframes tailWag{0%,100%{transform:rotate(0deg)}50%{transform:rotate(9deg)}}
@keyframes sproutSway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
@keyframes earTwitchLeft{0%,90%,100%{transform:rotate(0deg)}94%{transform:rotate(-4deg)}98%{transform:rotate(2deg)}}
@keyframes earTwitchRight{0%,88%,100%{transform:rotate(0deg)}92%{transform:rotate(4deg)}96%{transform:rotate(-2deg)}}
@keyframes glassShine{0%,80%,100%{transform:translateX(0);opacity:.3}88%{transform:translateX(18px);opacity:.8}94%{transform:translateX(30px);opacity:.1}}
@keyframes medalGleam{0%,100%{transform:rotate(0deg) scale(1)}50%{transform:rotate(3deg) scale(1.04)}}
@keyframes dotBlink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes shadowBreathe{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(.86);opacity:.45}}
.mascot-float{transform-origin:300px 400px;animation:floatBob 3s ease-in-out infinite}
.head-bob{transform-origin:300px 275px;animation:headBob 1.8s ease-in-out infinite}
.tail-motion{transform-origin:360px 425px;animation:tailWag 2.5s ease-in-out infinite}
.sprout-motion{transform-origin:300px 195px;animation:sproutSway 2.8s ease-in-out infinite}
.left-ear{transform-origin:240px 220px;animation:earTwitchLeft 5s ease-in-out infinite}
.right-ear{transform-origin:360px 220px;animation:earTwitchRight 4.5s ease-in-out infinite}
.glass-reflect{animation:glassShine 4s ease-in-out infinite}
.medal-motion{transform-origin:300px 387px;animation:medalGleam 3s ease-in-out infinite}
.paw-left{transform-origin:232px 454px;animation:typeLeft .55s ease-in-out infinite}
.paw-right{transform-origin:368px 454px;animation:typeRight .55s ease-in-out infinite}
.ground-shadow{transform-origin:300px 520px;animation:shadowBreathe 3s ease-in-out infinite}
.dot-1{animation:dotBlink .9s ease-in-out infinite}
.dot-2{animation:dotBlink .9s ease-in-out .15s infinite}
.dot-3{animation:dotBlink .9s ease-in-out .3s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
